<!doctype html>
<html lang="ja" data-theme="zeno">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>inu.vaked.dev — 犬 · 猫 · 馬 | おさんぽサービス by Peter Lodri</title>
    <meta
      name="description"
      content="犬の散歩、猫の世話、馬の手入れ。日本語・English・中文対応。QRコードで予約、inu@8b.is まで。A neighbourhood animal-care service by Peter Lodri."
    />
    <meta name="theme-color" content="#070312" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="inu.vaked.dev — 犬 · 猫 · 馬" />
    <meta
      property="og:description"
      content="Dog walking, cat visits, horse care. 日本語 · English · 中文. Book by QR or inu@8b.is."
    />
    <meta property="og:image" content="/assets/hero.svg" />
    <link rel="icon" type="image/svg+xml" href="/assets/favicon.svg" />
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <header class="site-header">
      <a class="brand" href="/">
        <span class="brand-kanji">犬</span>
        <span class="brand-words"><b>inu</b>.vaked.dev<small id="brand-sub"></small></span>
      </a>
      <div class="langs" role="group" aria-label="Language">
        <button type="button" data-lang-btn="ja" class="active">日本語</button>
        <button type="button" data-lang-btn="en">English</button>
        <button type="button" data-lang-btn="zh">中文</button>
      </div>
    </header>

    <main>
      <section class="hero">
        <div class="hero-copy">
          <p class="kicker" id="hero-kicker"></p>
          <h1 id="hero-title"></h1>
          <p class="lede" id="hero-lede"></p>
          <div class="hero-actions">
            <a class="btn sun" href="#book" id="hero-cta"></a>
            <a class="btn ghost" href="mailto:inu@8b.is">inu@8b.is</a>
          </div>
          <ul class="badges" id="hero-badges"></ul>
        </div>
        <div class="hero-art">
          <img src="/assets/hero.svg" alt="犬・猫・馬 walking against a golden sun" width="1600" height="900" />
        </div>
      </section>

      <section class="section" id="services">
        <p class="kicker" id="svc-kicker"></p>
        <h2 id="svc-title"></h2>
        <div class="cards">
          <article class="card sun">
            <div class="glyph">犬</div>
            <h3 id="svc1-t"></h3>
            <p id="svc1-d"></p>
            <p class="meta" id="svc1-m"></p>
          </article>
          <article class="card nebula">
            <div class="glyph">猫</div>
            <h3 id="svc2-t"></h3>
            <p id="svc2-d"></p>
            <p class="meta" id="svc2-m"></p>
          </article>
          <article class="card saiyan">
            <div class="glyph">馬</div>
            <h3 id="svc3-t"></h3>
            <p id="svc3-d"></p>
            <p class="meta" id="svc3-m"></p>
          </article>
        </div>
      </section>

      <section class="section" id="pricing">
        <p class="kicker" id="price-kicker"></p>
        <h2 id="price-title"></h2>
        <p class="section-lede" id="price-lede"></p>
        <div class="plans">
          <article class="plan">
            <h3 id="plan1-t"></h3>
            <p class="price"><span id="plan1-p"></span><small id="plan1-u"></small></p>
            <ul id="plan1-l"></ul>
            <a class="btn ghost" href="#book" id="plan1-a"></a>
          </article>
          <article class="plan featured">
            <span class="ribbon" id="plan2-ribbon"></span>
            <h3 id="plan2-t"></h3>
            <p class="price"><span id="plan2-p"></span><small id="plan2-u"></small></p>
            <ul id="plan2-l"></ul>
            <a class="btn sun" href="#book" id="plan2-a"></a>
          </article>
          <article class="plan">
            <h3 id="plan3-t"></h3>
            <p class="price"><span id="plan3-p"></span><small id="plan3-u"></small></p>
            <ul id="plan3-l"></ul>
            <a class="btn ghost" href="#book" id="plan3-a"></a>
          </article>
        </div>
        <details class="addons">
          <summary id="addons-sum"></summary>
          <ul id="addons-list"></ul>
        </details>
      </section>

      <section class="section" id="how">
        <p class="kicker" id="how-kicker"></p>
        <h2 id="how-title"></h2>
        <ol class="steps" id="how-steps"></ol>
      </section>

      <section class="section" id="animals">
        <p class="kicker" id="an-kicker"></p>
        <h2 id="an-title"></h2>
        <p class="section-lede" id="an-lede"></p>
        <div class="an-controls">
          <label class="an-search">
            <span class="sr-only">search animals</span>
            <input id="an-q" type="search" autocomplete="off" />
          </label>
          <div class="an-filters" id="an-filters" role="group" aria-label="Animal groups"></div>
          <p class="an-count" id="an-count"></p>
        </div>
        <div class="an-grid" id="an-grid"></div>
      </section>

      <section class="section book" id="book">
        <div class="book-copy">
          <p class="kicker" id="book-kicker"></p>
          <h2 id="book-title"></h2>
          <p class="section-lede" id="book-lede"></p>
          <div class="book-actions">
            <a class="btn sun" id="book-mail" href="mailto:inu@8b.is"></a>
            <a class="btn ghost" id="book-map" href="https://8b.vaked.dev" hidden></a>
          </div>
          <dl class="facts">
            <div><dt id="fact1-k"></dt><dd id="fact1-v"></dd></div>
            <div><dt id="fact2-k"></dt><dd id="fact2-v"></dd></div>
            <div><dt id="fact3-k"></dt><dd id="fact3-v"></dd></div>
          </dl>
        </div>
        <figure class="qr">
          <img src="/assets/qr.svg" alt="QR code — scan to email inu@8b.is" width="320" height="320" />
          <figcaption id="qr-cap"></figcaption>
        </figure>
      </section>
    </main>

    <footer class="site-footer">
      <div>
        <b>犬 · 猫 · 馬</b> — <span id="foot-line"></span>
      </div>
      <div class="foot-links">
        <a href="mailto:inu@8b.is">inu@8b.is</a>
        <a href="https://8b.vaked.dev">8b.vaked.dev</a>
        <a href="https://pocoo.vaked.dev">pocoo</a>
        <a href="https://github.com/8b-is">github</a>
      </div>
      <p id="foot-note"></p>
    </footer>

    <script type="module" src="/app.js"></script>
  </body>
</html>
